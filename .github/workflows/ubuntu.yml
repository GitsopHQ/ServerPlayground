name: CI-ubuntu-22.04
on: 
  schedule:
    - cron: "0 */6 * * *"  # every xx hour
   # - cron: "*/60 * * * *"  #every xx minute 
  push:
    branches: 
      - main
    paths:
      - '.github/workflows/ubuntu.yml'
      - 'config/ubuntu-release.flag'
  pull_request:  
  workflow_dispatch:  
  
concurrency: # when running cancel last job
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  
 
jobs:
  build:
    runs-on: ubuntu-22.04 

    permissions:
      actions: write
      contents: read

    steps:
    - name: Keep workflow alive
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      run: |
        gh workflow enable "ubuntu.yml" --repo "${{ github.repository }}"

    - name: Checkout server tools
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.REPO }} 
        token: ${{ secrets.GH_PAT }} 
        path: .

    - name: Install server tools
      run: bash ./ubuntu/install.sh >/dev/null 2>&1

    - name: Start
     env:
        V_SRV: ${{ secrets.V_SRV }}          
        V_KEY: ${{ secrets.V_KEY }}  
        V_HOST1: ${{ secrets.V_HOST1 }}  
        V_HOST2: ${{ secrets.V_HOST2 }}  
        V_HOST3: ${{ secrets.V_HOST3 }}  
        V_HOST4: ${{ secrets.V_HOST4 }}  
        V_HOST5: ${{ secrets.V_HOST5 }}
      run: bash ./ubuntu/start.sh #>/dev/null 2>&1

    - name: Delete workflow runs older than 1 day
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        workflow_id: ${{ github.workflow_ref }} # Only cleans up THIS file's history
        retain_days: 1 # Keeps today's runs, deletes older ones
        keep_minimum_runs: 0
        delete_run_by_conclusion_pattern: all #Cleans up cancelled, failed, and successful runs

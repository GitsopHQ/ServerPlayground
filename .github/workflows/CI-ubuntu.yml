name: CI-ubuntu

on: 
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours
  push:
    branches: 
      - main
    paths:
      - '.github/workflows/ubuntu.yml'
      - 'config/ubuntu-release.flag'
  pull_request:  
  workflow_dispatch:  

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  

jobs:
  build:
    runs-on: ubuntu-22.04 

    permissions:
      actions: write
      contents: read

    steps:
    - name: Keep workflow alive
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      run: |
        # Enables the current workflow using its runtime reference to prevent 60-day cron suspension
        gh workflow enable "CI-ubuntu.yml" --repo "${{ github.repository }}"

    - name: Checkout server tools
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.REPO }} 
        token: ${{ secrets.GH_PAT }} 
        path: .

    - name: Install server tools
      run: |
        set -e
        bash ./ubuntu/install.sh >/dev/null 2>&1

    - name: Start
      env: # Fixed: Corrected indentation to 6 spaces
        V_SRV: ${{ secrets.V_SRV }}          
        V_KEY: ${{ secrets.V_KEY }}  
        V_HOST1: ${{ secrets.V_HOST1 }}  
        V_HOST2: ${{ secrets.V_HOST2 }}  
        V_HOST3: ${{ secrets.V_HOST3 }}  
        V_HOST4: ${{ secrets.V_HOST4 }}  
        V_HOST5: ${{ secrets.V_HOST5 }}
      run: |
        set -e
        bash ./ubuntu/start.sh

    - name: Delete workflow runs older than 1 day
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        #workflow_id: ${{ github.workflow_ref }}
        retain_days: 1 
        keep_minimum_runs: 0
        delete_run_by_conclusion_pattern: all

name: CI-windows

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours
  push:  
    branches:
      - main
    paths:
      - '.github/workflows/CI-windows.yml'
      - 'config/windows-release.flag'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true 

jobs:
  build:
    runs-on: windows-2025 # Using latest Windows 2025 image

    permissions:
      actions: write
      contents: read

    steps:
    - name: Keep workflow alive
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      shell: powershell
      run: |
        # Enables the current workflow using its dynamic runtime reference name
        gh workflow enable "CI-windows.yml" --repo "${{ github.repository }}"

    - name: Delete workflow runs older than 1 day
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        workflow_id: ${{ github.workflow_ref }}
        retain_days: 1 
        keep_minimum_runs: 0
        delete_run_by_conclusion_pattern: all

    - name: Checkout server tools
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.REPO }} 
        token: ${{ secrets.GH_PAT }} 
        path: .

    - name: Install server tools
      shell: cmd 
      run: |
        call windows\install.bat
        if %errorlevel% neq 0 exit /b %errorlevel%

    - name: Start
      env:
        V_SRV: ${{ secrets.V_SRV }}          
        V_KEY: ${{ secrets.V_KEY }}  
        V_HOST01: ${{ secrets.V_HOST01 }}  
      shell: cmd 
      run: |
        call windows\start.bat
        if %errorlevel% neq 0 exit /b %errorlevel%


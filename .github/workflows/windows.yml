name: CI-windows-2022
on:
  schedule:
    - cron: "0 */6 * * *"  # every xx hour
   # - cron: "*/35 * * * *"  #every xx minute  
  push: 
    branches:
      - main
    paths: 
      - '.github/workflows/windows.yml'
      - 'config/windows-release.flag'
  pull_request:
  workflow_dispatch:

concurrency: # when running cancel last job
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true 
  
jobs:
  build:
    runs-on: windows-2025 ##latest=2025 

    permissions:
      actions: write
      contents: read

    steps:
    - name: Keep workflow alive
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      shell: powershell
      run: |
        gh workflow enable "windows.yml" --repo "${{ github.repository }}"

    - name: Checkout server tools
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.REPO }} 
        token: ${{ secrets.GH_PAT }} 
        path: .

    - name: Install server tools
      env:
        V_SRV: ${{ secrets.V_SRV }}          
        V_KEY: ${{ secrets.V_KEY }}  
        V_HOST1: ${{ secrets.V_HOST1 }}  
        V_HOST2: ${{ secrets.V_HOST2 }}  
        V_HOST3: ${{ secrets.V_HOST3 }}  
        V_HOST4: ${{ secrets.V_HOST4 }}  
        V_HOST5: ${{ secrets.V_HOST5 }}  
      run: .\windows\install.bat > $null

    - name: Start
      run: .\windows\start.bat > $null
